<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New project</title>
    <meta name="description" content="A plain HTML, Tailwind and JavaScript starter." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Tailwind v4, compiled in the browser. Theme and custom CSS go in the style block below. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));

      @theme {
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --color-brand-50: oklch(0.97 0.02 265);
        --color-brand-500: oklch(0.6 0.2 265);
        --color-brand-600: oklch(0.53 0.21 265);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Applied before paint, so a dark page never flashes light. -->
    <script>
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body class="min-h-dvh bg-white font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <header class="mx-auto flex max-w-5xl items-center justify-between px-4 py-5">
      <a href="/" class="font-semibold tracking-tight">New project</a>
      <button
        id="theme-toggle"
        type="button"
        class="rounded-full border border-zinc-200 px-3 py-1.5 text-sm text-zinc-600 hover:bg-zinc-50 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-900"
        aria-label="Toggle dark mode"
      >
        Theme
      </button>
    </header>

    <main class="mx-auto grid max-w-5xl place-items-center px-4 py-24 text-center">
      <p class="rounded-full bg-brand-50 px-3 py-1 text-sm font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-500">HTML + Tailwind</p>
      <h1 class="mt-6 max-w-2xl text-4xl font-bold tracking-tight text-balance sm:text-5xl">Describe what you want to build.</h1>
      <p class="mt-4 max-w-xl text-lg text-zinc-600 dark:text-zinc-400">
        Plain HTML, Tailwind and JavaScript. No build step: edit a file and the page reloads.
      </p>
      <button
        id="counter"
        type="button"
        class="mt-8 rounded-lg bg-brand-600 px-5 py-2.5 font-medium text-white shadow-sm hover:bg-brand-500"
      >
        Clicked 0 times
      </button>
    </main>
  </body>
</html>
